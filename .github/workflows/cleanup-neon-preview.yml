name: Cleanup Neon preview branch

# The Vercel-Neon integration provisions a preview/<git-branch> database for
# every PR (see migrate.yml). Nothing tore those down, so they accumulate until
# the project hits its branch limit. Delete the branch when its PR closes or
# merges, following Neon's guide:
# https://neon.com/docs/guides/vercel-branch-cleanup
on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_BRANCH: preview/${{ github.head_ref }}
    steps:
      - name: Delete preview branch if it exists
        # A PR that never got a preview deploy has no branch to delete — that's
        # a clean no-op. Real failures (bad credentials, API errors) still fail
        # the job instead of being swallowed by continue-on-error.
        run: |
          set -euo pipefail
          # `branches list` fails loudly on auth/API errors, so a bad key fails
          # the job here rather than being misread as "branch not found".
          branches="$(npx neonctl branches list --project-id "$NEON_PROJECT_ID" --output json)"
          if echo "$branches" | jq -e --arg b "$NEON_BRANCH" 'any(.[]; .name == $b)' > /dev/null; then
            npx neonctl branches delete "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID"
            echo "Deleted $NEON_BRANCH"
          else
            echo "No preview branch $NEON_BRANCH; nothing to delete."
          fi
